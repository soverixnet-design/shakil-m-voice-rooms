plugins { id 'com.android.application' }
android {
 namespace 'work.earnbd.app'
 compileSdk 36
 defaultConfig { applicationId 'work.earnbd.app'; minSdk 23; targetSdk 36; versionCode 5; versionName '1.4.0' }
 signingConfigs {
  release {
   def signingPath = System.getenv('EARNBD_KEYSTORE_PATH')
   if (signingPath) {
    storeFile file(signingPath)
    storePassword System.getenv('EARNBD_KEYSTORE_PASSWORD')
    keyAlias System.getenv('EARNBD_KEY_ALIAS')
    keyPassword System.getenv('EARNBD_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   debuggable false
   if (System.getenv('EARNBD_KEYSTORE_PATH')) signingConfig signingConfigs.release
  }
 }
}
