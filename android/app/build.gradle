plugins {
    id 'com.android.application'
}
// An isolated package for phone tests. Normal Android builds keep their original ID and URL.
def voicePreviewBuild = providers.gradleProperty('voicePreview').orNull == 'true'
android {
    namespace 'work.earnbd.app'
    compileSdk 36
    defaultConfig {
        applicationId(voicePreviewBuild ? 'work.earnbd.app.voicepreview' : 'work.earnbd.app')
        manifestPlaceholders = [appLabel: voicePreviewBuild ? 'EarnBD Voice Test' : 'EarnBD Shakil']
        buildConfigField('String', 'APP_URL', voicePreviewBuild ? '"https://voice.soverixnet.online/shakilm-preview/"' : '"https://earnbd.work/"')
        buildConfigField('boolean', 'VOICE_PREVIEW', voicePreviewBuild ? 'true' : 'false')
        minSdk 23
        targetSdk 36
        versionCode 10
        versionName '1.9.0'
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            def signingPath = System.getenv('EARNBD_KEYSTORE_PATH')
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('EARNBD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('EARNBD_KEY_ALIAS')
                keyPassword System.getenv('EARNBD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (System.getenv('EARNBD_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
}
dependencies {
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.firebase:firebase-messaging:23.1.0'
}
