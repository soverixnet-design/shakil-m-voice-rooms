services:
  - type: web
    name: earnbd-game-server
    runtime: node
    plan: free
    rootDir: functions
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: ALLOWED_ORIGINS
        value: https://earnbd.work,https://www.earnbd.work,https://soverixnet-design.github.io,https://voice.soverixnet.online
