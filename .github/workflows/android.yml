name: Build Android preview
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'ANDROID_SETUP_BN.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-preview
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: earnbd-android-preview-signing-v2
      - run: gradle -p android assembleDebug lintDebug
      - name: Report Google login fingerprint
        run: gradle -p android signingReport > Android-Signing-Fingerprints.txt
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk EarnBD-Shakil-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EarnBD-Shakil-preview
          path: |
            EarnBD-Shakil-preview.apk
            Android-Signing-Fingerprints.txt
      - name: Publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-1.10-preview || gh release create android-1.10-preview --target "$GITHUB_SHA" --title 'EarnBD Android 1.10 messages preview' --notes 'Android 1.10 adds private message notifications via Firebase Cloud Messaging and opens the sender chat when tapped. Enable notifications from the Messages page. Includes the existing Google account picker, Email login, microphone and gallery support. Google login requires the Firebase Android package/SHA registration. Room audio uses media playback and microphone foreground services. Debug-signed test build; not a Play Store release. See ANDROID_SETUP_BN.md.' --prerelease
          gh release upload android-1.10-preview EarnBD-Shakil-preview.apk Android-Signing-Fingerprints.txt --clobber
