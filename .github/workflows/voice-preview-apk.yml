name: Build separate EarnBD LiveKit Android test APK

on:
  push:
    branches: [feature/shakilm-voice-only-do-staging-20261028]
    paths:
      - 'android/**'
      - '.github/workflows/voice-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install required Android API and build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile separate debug-signed preview APK
        run: gradle -p android :app:assembleDebug -PvoicePreview=true --no-daemon
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false'
      - name: Verify separate package ID and prepare download
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='work.earnbd.app.voicepreview'"
          cp "$APK" EarnBD-LiveKit-Test.apk
          sha256sum EarnBD-LiveKit-Test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EarnBD-LiveKit-Test-APK
          path: EarnBD-LiveKit-Test.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish direct APK download as pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="livekit-test-$GITHUB_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" EarnBD-LiveKit-Test.apk --clobber
          else
            gh release create "$TAG" EarnBD-LiveKit-Test.apk --target "$GITHUB_SHA" --prerelease --title 'EarnBD LiveKit Test APK' --notes 'Separate debug-signed test app. Opens the isolated LiveKit browser preview. Does not replace the production app.'
          fi
          echo "APK_RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/EarnBD-LiveKit-Test.apk"
