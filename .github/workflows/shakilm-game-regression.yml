name: Shakil M Games Regression Tests

on:
  push:
    branches:
      - deploy/shakilm-do-readonly-test-20261027
  workflow_dispatch:

jobs:
  game-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for diagnostics
        # Main branch's root npm lockfile currently disagrees with package.json.
        # Ignore it for this diagnostic run; do not rewrite tracked app files.
        run: npm install --no-save --package-lock=false --no-audit
      - name: Install backend dependencies from its own lockfile
        run: npm ci --prefix functions --omit=dev --no-audit
      - name: Test game, wallet, voice and recovery services
        run: npm run test:games
      - name: Confirm original web app still builds
        run: npm run build
