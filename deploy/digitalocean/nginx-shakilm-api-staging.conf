# Shakil M read-only HTTPS preparation. Separate Nginx virtual host.
# Does not change Akira's virtual host or publish a game API.
# DNS A record must point shakilm-api.soverixnet.online to the existing 2 GB droplet.
# After DNS, provision a trusted HTTPS certificate before using this hostname in the app.
server {
    listen 80;
    server_name shakilm-api.soverixnet.online;

    add_header X-Content-Type-Options nosniff always;

    location = /ping {
        proxy_pass http://127.0.0.1:4315/ping;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4315/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No game, wallet, login or voice operations in this staging vhost.
    location / { return 404; }
}
