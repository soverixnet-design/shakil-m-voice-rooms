# Additional opt-in service: preserves Akira, Render, wallets and the read-only test.
services:
  shakilm-voice-only-staging:
    build:
      context: ../../functions
      dockerfile: Dockerfile.voice-staging
    container_name: shakilm-voice-only-staging
    restart: unless-stopped
    env_file:
      - /etc/shakilm-secrets/voice.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      PORT: "10000"
      NODE_ENV: production
    volumes:
      - /etc/shakilm-secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "127.0.0.1:4316:10000"
    mem_limit: 192m
    cpus: 0.35
    pids_limit: 80
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
