<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ক্যারাম</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3ede2;--fg:#2a1f14;--card:#fffaf0;--line:#d9ccb4;--accent:#2e6f9e}
html{background:#1b1464}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;color:#fff;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px;min-height:100vh;position:relative;overflow-x:hidden;
background:radial-gradient(circle at 12% 8%,#ff7a59 0,transparent 38%),radial-gradient(circle at 90% 18%,#7b5cff 0,transparent 42%),radial-gradient(circle at 50% 105%,#00c9a7 0,transparent 48%),linear-gradient(160deg,#1b1464,#4a1d7a 55%,#8a1f5c);background-attachment:fixed}
.cn{display:inline-block;border-radius:50%;box-shadow:inset -5px -7px 10px rgba(0,0,0,.35),inset 4px 5px 7px rgba(255,255,255,.35),0 10px 16px rgba(0,0,0,.35)}
.cn.w{background:radial-gradient(circle at 35% 30%,#fff,#d8cdb0)}
.cn.k{background:radial-gradient(circle at 35% 30%,#6b625b,#15110f)}
.cn.r{background:radial-gradient(circle at 35% 30%,#ff8a7c,#b3261e)}
.cn.b{background:radial-gradient(circle at 35% 30%,#9fd8ff,#2e6fae)}
.wrap,.menu{position:relative;z-index:1}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
.menu{display:flex;flex-direction:column;gap:14px;max-width:420px;width:100%;margin-top:4vh;padding:20px;border-radius:24px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);box-shadow:0 22px 44px rgba(0,0,0,.4)}
.logo{display:flex;justify-content:center;gap:12px}.logo i{width:34px;height:34px}
.menu h1{margin:0;text-align:center;font-size:2.7rem;color:#ffe08a;text-shadow:0 4px 0 #8f5c0a}
.menu p{margin:0;text-align:center;opacity:.9}
button{font:inherit;font-weight:600;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.menu button{padding:15px;font-size:1.08rem}
[data-m=bot]{--c1:#ffb347;--c2:#ff6a3d;--sh:#b8401f}
[data-m=two]{--c1:#4fe0c0;--c2:#12a38a;--sh:#0a6b5a}
[data-m=four]{--c1:#a98bff;--c2:#6a3df0;--sh:#42239e}
.menu button[data-m]{color:#fff;border:none;background:linear-gradient(var(--c1),var(--c2));box-shadow:0 7px 0 var(--sh)}
.chips{display:flex;gap:8px}
.chips button{flex:1;padding:8px;font-size:.95rem;background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.35)}
.chips button.on{background:linear-gradient(#ffe27a,#ffb300);color:#4a2d00}
details{background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92rem;line-height:1.65}
summary{cursor:pointer;font-weight:600}
.scores{display:flex;gap:8px}
.p{flex:1;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.p.on{border-color:#ffd54a;box-shadow:0 0 16px rgba(255,213,74,.7)}
.p b{font-size:1.5rem}
#msg{text-align:center;min-height:1.9em;font-weight:600;background:rgba(0,0,0,.35);border-radius:999px;padding:3px 12px}
canvas{width:100%;aspect-ratio:1;border-radius:14px;touch-action:none;display:block;background:#5a3a22;border:3px solid rgba(255,255,255,.25)}
.row{display:flex;gap:8px}.row button{flex:1}
.pw{position:relative;height:30px;border-radius:12px;background:var(--card);color:var(--fg);border:2px solid var(--line);overflow:hidden}.pw i{position:absolute;left:0;top:0;bottom:0;width:0}.pw span{position:relative;display:block;text-align:center;line-height:26px;font-weight:700;font-size:.9rem}
</style></head>
<body>
<div class="menu" id="menu">
<div class="logo"><i class="cn w"></i><i class="cn k"></i><i class="cn r"></i><i class="cn b"></i></div>
<h1>ক্যারাম</h1>
<p>লক্ষ্য পয়েন্ট</p>
<div class="chips"><button data-t="25">২৫</button><button data-t="30">৩০</button><button data-t="40">৪০</button></div>
<p>খেলার ধরন</p>
<button data-m="bot">🧑 একা খেলুন (বট রাহাত)</button>
<button data-m="two">👥 ২ জন (একই স্ক্রিনে)</button>
<button data-m="four">🎯 ৪ জন (২ বনাম ২ টিম)</button>
<details><summary>নিয়মাবলী</summary>
• সাদা দল সাদা গুটি, কালো দল কালো গুটি পকেটে ফেলবে।<br>
• লাল কুইন ফেললে ৩ পয়েন্ট। সাথে নিজের গুটি ফেলে কভার করতে হবে।<br>
• স্ট্রাইকার পকেটে পড়লে ফাউল।</details>
<button id="exb" style="background:#f44;color:#fff">✖ বন্ধ করুন</button>
</div>
<div class="wrap" id="game" hidden>
<div class="scores"><div class="p" id="s0"><span id="n0"></span><b id="v0">0</b></div><div class="p" id="s1"><span id="n1"></span><b id="v1">0</b></div></div>
<div id="msg"></div>
<canvas id="c" width="600" height="600"></canvas>
<div class="pw"><i id="pwi"></i><span id="pwt"></span></div>
<div class="row"><button id="home">মেনু</button><button id="rs">নতুন খেলা</button><button id="mu">🔊</button><button id="ex2" style="background:#a22;color:#fff">✖ এক্সিট</button></div>
</div>
<script>
const W=600,F=28,LO=110,HI=490,R=13,SR=17,PR=30;
const PC=[[F+10,F+10],[W-F-10,F+10],[F+10,W-F-10],[W-F-10,W-F-10]];
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');
const SIDE=['নিচের','ডানের','উপরের','বাঁয়ের'],NRM=[[0,-1],[-1,0],[0,1],[1,0]];
let mode='bot',diff=1,sides=[0,2],coins=[],st,B,turn,score,cap,pend,state='idle',drag,slide,ev,over,note='',mute=false,ac,ba=null,fc=0,board=1,target=25,botName='রাহাত',bal=50000;
const mk=(a,b,t)=>({x:a,y:b,vx:0,vy:0,t,r:R,m:1,in:true});
const place=(s,u)=>s===0?[u,W-90]:s===1?[W-90,u]:s===2?[u,90]:[90,u];
function setU(u){st.u=Math.max(LO,Math.min(HI,u));[st.x,st.y]=place(sides[turn],st.u)}
const isBot=()=>mode==='bot'&&turn===1;
const human=()=>!over&&state==='aim'&&!isBot();
function init(){score=[0,0];turn=0;over=false;board=1;setup()}
function setup(){
  const c=W/2;coins=[mk(c,c,'q')];
  for(let i=0;i<6;i++){const a=i*Math.PI/3;coins.push(mk(c+Math.cos(a)*2.1*R,c+Math.sin(a)*2.1*R,i%2?'b':'w'))}
  for(let i=0;i<12;i++){const a=i*Math.PI/6+Math.PI/12;coins.push(mk(c+Math.cos(a)*4.05*R,c+Math.sin(a)*4.05*R,i%2?'b':'w'))}
  st={x:c,y:W-90,vx:0,vy:0,r:SR,m:1.6,in:true,k:1,u:300};
  B=coins.concat([st]);cap=[[],[]];pend=null;drag=null;slide=false;note='';ev=[];ba=null;ready();
}
function ready(){state='aim';st.vx=st.vy=0;st.in=true;setU(300);hud();if(isBot()&&!over)setTimeout(bot,300)}
function hud(){
  $('n0').textContent=mode==='bot'?'আপনি (সাদা)':'খেলোয়াড় ১';$('n1').textContent=mode==='bot'?botName:'খেলোয়াড় ২';$('v0').textContent=score[0];$('v1').textContent=score[1];
  $('s0').classList.toggle('on',!over&&turn%2===0);$('s1').classList.toggle('on',!over&&turn%2===1);
  $('msg').textContent=over?'খেলা শেষ!':(mode==='bot'?(turn?botName+' ভাবছে...':'আপনার পালা'):'পালা: '+SIDE[sides[turn]]);
}
function shoot(vx,vy){st.vx=vx;st.vy=vy;state='move';fc=0;ev=[];drag=null;slide=false}
const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*W/r.height}};
cv.addEventListener('pointerdown',e=>{
  if(!human())return;cv.setPointerCapture(e.pointerId);const p=pos(e);
  if(Math.hypot(p.x-st.x,p.y-st.y)<48)slide=true;else drag=p;
});
cv.addEventListener('pointermove',e=>{if(!human())return;const p=pos(e);if(slide)setU(sides[turn]%2?p.y:p.x);else if(drag)drag=p});
cv.addEventListener('pointerup',e=>{
  if(slide){slide=false;return}if(!drag||!human()){drag=null;return}
  const p=pos(e);drag=null;const dx=st.x-p.x,dy=st.y-p.y,d=Math.hypot(dx,dy);if(d<14)return;
  const sp=Math.min(d,170)*0.135;shoot(dx/d*sp,dy/d*sp);
});
function hit(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),md=a.r+b.r;if(d>=md||d===0)return;
  const nx=dx/d,ny=dy/d,ov=md-d,t=a.m+b.m;
  a.x-=nx*ov*b.m/t;a.y-=ny*ov*b.m/t;b.x+=nx*ov*a.m/t;b.y+=ny*ov*a.m/t;
  const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv>=0)return;
  const j=-1.85*rv/(1/a.m+1/b.m);
  a.vx-=j*nx/a.m;a.vy-=j*ny/a.m;b.vx+=j*nx/b.m;b.vy+=j*ny/b.m;
}
function frame(b,e){
  for(let s=0;s<4;s++){
    for(const o of b){
      if(!o.in)continue;o.x+=o.vx/4;o.y+=o.vy/4;
      const lo=F+o.r,hi=W-F-o.r;
      if(o.x<lo||o.x>hi){o.x=o.x<lo?lo:hi;o.vx=-o.vx*.8}
      if(o.y<lo||o.y>hi){o.y=o.y<lo?lo:hi;o.vy=-o.vy*.8}
    }
    for(let i=0;i<b.length;i++){if(!b[i].in)continue;for(let j=i+1;j<b.length;j++)if(b[j].in)hit(b[i],b[j])}
  }
  let mv=false;
  for(const o of b){
    if(!o.in)continue;const f=o.vx*o.vx+o.vy*o.vy<1.5?.94:.982;o.vx*=f;o.vy*=f;
    if(o.vx*o.vx+o.vy*o.vy<.04)o.vx=o.vy=0;else mv=true;
    for(const p of PC)if(Math.hypot(o.x-p[0],o.y-p[1])<PR-3){o.in=false;o.vx=o.vy=0;e.push(o);break}
  }
  return mv;
}
function back(c){c.x=W/2;c.y=W/2;c.vx=c.vy=0;c.in=true;}
function endShot(){
  const T=turn%2,O=1-T,own=T?'b':'w',qc=coins[0];
  let n=0,q=false,foul=false;
  for(const o of ev){
    if(o.k)foul=true;else if(o.t==='q')q=true;
    else if(o.t===own){n++;score[T]++;cap[T].push(o)}else{score[O]++;cap[O].push(o)}
  }
  if(pend&&pend.team===T){if(n>0&&!foul){score[T]+=3}else{back(qc)}pend=null}
  if(q){if(foul)back(qc);else if(n>0){score[T]+=3}else{pend={team:T}}}
  if(foul&&cap[T].length){back(cap[T].pop());score[T]--}
  if(score[0]>=target||score[1]>=target){
    over=true;hud();
    if(score[0]>score[1]){bal+=1000;parent.postMessage({type:'wallet',balance:bal},'*')}
    return;
  }
  turn=(turn+1)%sides.length;ready();
}
function bot(){
  const my=coins.filter(c=>c.in&&(c.t==='b'||c.t==='q'));if(!my.length)return;
  let bp=PC[0],bc=my[0],md=999;my.forEach(c=>PC.forEach(p=>{const d=Math.hypot(p[0]-c.x,p[1]-c.y);if(d<md){md=d;bp=p;bc=c}}));
  const a=Math.atan2(bp[1]-bc.y,bp[0]-bc.x);const hx=bc.x-Math.cos(a)*(R+SR),hy=bc.y-Math.sin(a)*(R+SR);
  setU(Math.max(LO,Math.min(HI,hx)));const fa=Math.atan2(hy-st.y,hx-st.x),sp=Math.min(18,Math.max(8,md/25+7));
  shoot(Math.cos(fa)*sp,Math.sin(fa)*sp);
}
function coin(o){
  const r=o.r,X=o.x,Y=o.y;x.beginPath();x.arc(X,Y,r,0,7);
  x.fillStyle=o.k?'#2e78ad':o.t==='q'?'#dc2626':o.t==='w'?'#fff':'#222';x.fill();
  x.strokeStyle='#0004';x.stroke();
}
function draw(){
  x.fillStyle='#5a3a22';x.fillRect(0,0,W,W);
  x.fillStyle='#e0bc7c';x.fillRect(F,F,W-2*F,W-2*F);
  x.strokeStyle='#b91c1c';x.beginPath();x.arc(W/2,W/2,70,0,7);x.stroke();
  PC.forEach(p=>{x.beginPath();x.arc(p[0],p[1],PR,0,7);x.fillStyle='#111';x.fill()});
  coins.forEach(c=>{if(c.in)coin(c)});if(st.in)coin(st);
  if(drag&&human()){x.beginPath();x.moveTo(st.x,st.y);x.lineTo(drag.x,drag.y);x.strokeStyle='#f00';x.lineWidth=3;x.stroke()}
}
function loop(){if(state==='move'){if(++fc>240)for(const o of B)o.vx=o.vy=0;if(!frame(B,ev))endShot()}draw();requestAnimationFrame(loop)}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;sides=mode==='four'?[0,1,2,3]:[0,2];$('menu').hidden=true;$('game').hidden=false;init()});
$('home').onclick=()=>{state='idle';$('menu').hidden=false;$('game').hidden=true};
$('rs').onclick=init;$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊'};
$('exb').onclick=$('ex2').onclick=()=>{parent.postMessage({type:'exit'},'*')};
addEventListener('message',e=>{if(e.data&&e.data.type=='setBalance')bal=+e.data.balance});
init();loop();
</script></body></html>
