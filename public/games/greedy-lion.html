async function done(tg){const bet=bets.reduce((a,b)=>a+b,0),win=Math.round(bets[tg]*IT[tg].m+GR.reduce((a,g,j)=>a+(g.s.includes(tg)?bets[8+j]*g.m:0),0));

hist.unshift({r:round,e:IT[tg].e,bet,win,b:bets.map((x,i)=>x?(i<8?IT[i].e:GR[i-8].e)+k(x):'').filter(Boolean).join(' ')});hist=hist.slice(0,50);
if(bet)lb.p.Shakil=(lb.p.Shakil||0)+win;
const rows=[];if(win>0)rows.push({n:'Shakil',w:win,av:'👕'});
[...lb.u].sort(()=>Math.random()-.5).slice(0,5).forEach(U=>{const n=U.n;const bi=Math.floor(Math.random()*8),a=[1e3,1e4,1e5][Math.floor(Math.random()*3)]*(1+Math.floor(Math.random()*3)),gj=Math.random()<.5?(Math.random()<.5?0:1):-1;
let w=bi===tg?a*IT[tg].m:0;if(gj>=0&&GR[gj].s.includes(tg))w+=a*GR[gj].m;U.v+=w;rows.push({n,w,av:AV[Math.floor(Math.random()*5)]})});
rows.sort((a,b)=>b.w-a.w);const tp=rows.slice(0,3);topw={n:tp[0].n,v:tp[0].w||topw.v};
$('rno').textContent=round;$('re').textContent=IT[tg].e;$('ea').textContent=f(win);$('bb').textContent=f(bet);
const ord=[tp[1],tp[0],tp[2]];$('rk').innerHTML=ord.map((p,i)=>`<div class="${i==1?'f':''}">${i==1?'👑':['🥈','🥉'][i?1:0]}<br>${p.av}<br>${p.n.slice(0,9)}<br>🪙 ${k(Math.round(p.w))}</div>`).join('');
phase='res';t=6;$('rc').textContent='6s';$('res').classList.add('show');
tone(160,0,.3,'sine',.35,60);if(win>0)winSnd();else if(bet>0)loseSnd();
const big=tp[0];if(big.w>=100000||win>0){const bn=$('ban');bn.textContent=`${big.av} ${big.n} — Win ${f(big.w)} coins`;bn.classList.add('show');setTimeout(()=>bn.classList.remove('show'),3500)}
save();render()}
function newRound(){round++;bets=Array(10).fill(0);$('res').classList.remove('show');document.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));phase='bet';t=20;$('tm').textContent=20;if(auto&&last)applyLast();save();render()}
$('ap').onclick=()=>{auto=!auto;if(auto&&phase==='bet'&&last&&!bets.some(x=>x))applyLast();render()};
let mus=true,mi=0;const MEL=[523,659,784,659,880,784,659,523,587,698,880,698,784,659,587,392];
setInterval(()=>{if(phase==='load'||!mus||mute)return;const n=MEL[mi++%16];tone(n,0,.22,'triangle',.06);if(mi%4==1)tone(n/2,0,.5,'sine',.08)},260);
['touchstart','pointerdown','click'].forEach(e=>document.addEventListener(e,()=>{try{ctx()}catch(_){}}));
$('mu').onclick=()=>{mus=!mus;$('mu').textContent=mus?'♪':'🔇';toast(mus?'Music on':'Music off')};
$('bk').onclick=()=>{if(walletBusy||bets.some(x=>x)&&phase!=='res')return toast('রাউন্ড শেষ হলে বের হোন');parent.postMessage({type:'gl-exit'},location.origin)};
$('pl').onclick=()=>toast('কয়েন রিচার্জ করতে অ্যাপের ওয়ালেট খুলুন');
function modal(h){$('mb').innerHTML=h+'<br><button onclick="$(\'md\').style.display=\'none\'">Close</button>';$('md').style.display='flex'}
function hview(tab){let h;
if(tab){const all=[...lb.u,{n:'Shakil',v:lb.p.Shakil||0,me:1}].sort((x,y)=>y.v-x.v).slice(0,100);
h='<tr><th>#</th><th align=left>User</th><th align=left>Coins won</th></tr>'+all.map((x,i)=>`<tr${x.me?' style="background:#fff3c4"':''}><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${AV[i%5]} ${x.me?'<b>Shakil (you)</b>':x.n}</td><td class="w">🪙 ${f(x.v)}</td></tr>`).join('')}
else h=hist.length?hist.map(x=>`<tr><td>#${x.r}</td><td>${x.e}</td><td>${x.b||'—'}<br><small>Bet ${f(x.bet)}</small></td><td class="${x.win?'w':'l'}">${x.win?'+'+f(x.win):'0'}</td></tr>`).join(''):'<tr><td>No rounds played yet</td></tr>';
modal(`<h3>${tab?'🏆 Ranking — Top 100 today':'📜 My History'}</h3><button onclick="hview(1)">Ranking</button><button onclick="hview(0)">My History</button><table>${h}</table>`)}
$('hs').onclick=()=>hview(1);
$('hp').onclick=()=>modal(`<h3>How to play</h3>Tap a chip, then tap food stalls during the 20s betting time. The lion's wheel stops on one food.<table>${IT.map(x=>`<tr><td>${x.e}</td><td>x${x.m}</td></tr>`).join('')}<tr><td>🥗 Salad</td><td>x1.25 — wins on 🍓🌽🥬🍇</td></tr><tr><td>🍕 Pizza</td><td>x4.3 — wins on 🍗🐙🐟🥩</td></tr></table>Rarer food = bigger prize. Auto Play repeats your last bets every round. Virtual coins only; no real money. Other players shown are simulated; rankings are demo rankings.`);
function start(){phase='bet';t=20;render();setInterval(tick,1000)}
function gate(){if(S.get('g18',false))return start();$('gate').style.display='flex';$('g1').onclick=()=>{S.set('g18',true);$('gate').style.display='none';beep(600,.1);start()};$('g0').onclick=()=>parent.postMessage({type:'gl-exit'},location.origin)}
render();let p=0;const li=setInterval(()=>{p++;$('lp').style.width=p+'%';$('lt').textContent='Loading… '+p+'%';if(p>=100){clearInterval(li);$('load').style.display='none';gate()}},10);
</script></body></html>
